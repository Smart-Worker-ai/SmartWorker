# Hyraku on AIC Cloud shared-IP VPS.
# Public 80/443/8080 are reserved. Published ports (change in .env.hyraku if the
# panel rejects them):
#   31080  customer + admin (Host: admin.* → admin)
#   31081  admin only (for Add Domain if Host routing is not available)
#
#   cp .env.example .env.hyraku
#   docker compose --env-file .env.hyraku up -d --build

name: hyraku

services:
  hyraku_admin_api:
    build:
      context: ./admin/backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      HYRAKU_JWT_SECRET: ${HYRAKU_JWT_SECRET:?set in .env.hyraku}
      HYRAKU_ADMIN_USER: ${HYRAKU_ADMIN_USER:-hyraku}
      HYRAKU_ADMIN_PASSWORD: ${HYRAKU_ADMIN_PASSWORD:?set in .env.hyraku}
      HYRAKU_DB_PATH: /app/data/hyraku.db
      HYRAKU_DB_KEY: ${HYRAKU_DB_KEY:?set in .env.hyraku (openssl rand -hex 32)}
      HYRAKU_COOKIE_SECURE: ${HYRAKU_COOKIE_SECURE:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://hyraku.com,https://www.hyraku.com,https://hyraku.in,https://www.hyraku.in,https://admin.hyraku.com,https://admin.hyraku.in,https://zyoim.aiccloud.online}
    volumes:
      - hyraku_admin_data:/app/data
    expose:
      - "8002"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8002/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  hyraku_admin_web:
    build:
      context: ./admin/frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      hyraku_admin_api:
        condition: service_healthy
    expose:
      - "80"
    ports:
      # Loopback only: the admin desk is reached through the SSH tunnel, never directly.
      - "127.0.0.1:${HYRAKU_ADMIN_PORT:-31081}:80"

  customer_frontend:
    build:
      context: ./customer
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      hyraku_admin_api:
        condition: service_healthy
    expose:
      - "80"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${HYRAKU_HTTP_PORT:-31080}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - customer_frontend
      - hyraku_admin_web

volumes:
  hyraku_admin_data:
  caddy_data:
  caddy_config:
