# Hyraku on AIC Cloud shared-IP VPS.
# Secrets live in .env.hyraku (never rsynced). Compose reads that file itself,
# so `docker compose logs` / `ps` / `up` work from /opt/hyraku with no extra flags.
#
#   docker compose up -d --build

name: hyraku

services:
  hyraku_admin_api:
    build:
      context: ./admin/backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.hyraku
    environment:
      HYRAKU_DB_PATH: /app/data/hyraku.db
    volumes:
      - hyraku_admin_data:/app/data
    expose:
      - "8002"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8002/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s

  hyraku_admin_web:
    build:
      context: ./admin/frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.hyraku
    depends_on:
      hyraku_admin_api:
        condition: service_healthy
    expose:
      - "80"
    ports:
      # Loopback only: the admin desk is reached through the SSH tunnel, never directly.
      - "127.0.0.1:${HYRAKU_ADMIN_PORT:-31081}:80"

  customer_frontend:
    build:
      context: ./customer
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      hyraku_admin_api:
        condition: service_healthy
    expose:
      - "80"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${HYRAKU_HTTP_PORT:-31080}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - customer_frontend
      - hyraku_admin_web

volumes:
  hyraku_admin_data:
  caddy_data:
  caddy_config:
