name: workers_portal_app
description: Workers Portal and Digital Vault Flutter app scaffold
publish_to: 'none'
version: 0.1.1+2

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  flutter_riverpod: ^2.5.1
  flutter_secure_storage: ^9.2.2
  google_fonts: ^6.2.1
  image_picker: ^1.1.2
  qr_flutter: ^4.1.0
  flutter_map: ^7.0.2
