version: '3.8'

services:
  # ─── Infrastructure ────────────────────────────────

  postgres:
    image: postgres:16-alpine
    container_name: sms-gw-postgres
    environment:
      POSTGRES_DB: sms_gateway
      POSTGRES_USER: sms_gateway_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dev-password-change-me}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sms_gateway_user -d sms_gateway"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: sms-gw-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ─── Application ───────────────────────────────────

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: sms-gw-api
    env_file: ../.env
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
    ports:
      - "3100:3100"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: Dockerfile.worker
    container_name: sms-gw-worker
    env_file: ../.env
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ─── Monitoring ────────────────────────────────────

  prometheus:
    image: prom/prometheus:latest
    container_name: sms-gw-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - promdata:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: sms-gw-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "3200:3000"
    volumes:
      - grafanadata:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  promdata:
  grafanadata:
