name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: workers_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install backend dependencies
        working-directory: ./worker_website/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Run backend tests
        working-directory: ./worker_website/backend
        env:
          DATABASE_URL: postgresql+asyncpg://test_user:test_pass@localhost:5432/workers_test
          ADMIN_SECRET: test-secret
          SMS_GATEWAY_URL: http://localhost:8001
          CORS_ORIGINS: http://localhost:5173
          SELF_BASE_URL: http://localhost:8000
        run: |
          pytest tests/ -v --tb=short

      - name: Upload coverage
        working-directory: ./worker_website/backend
        run: |
          pytest tests/ --cov=. --cov-report=xml 2>/dev/null || true

      - name: Upload to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./worker_website/backend/coverage.xml
          flags: backend
          name: backend-coverage

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: ./worker_website/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./worker_website/frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: ./worker_website/frontend
        run: npm run test -- --run

      - name: Build frontend
        working-directory: ./worker_website/frontend
        run: npm run build

  build-docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./worker_website/backend
          push: false
          tags: worker-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./worker_website/frontend
          dockerfile: ./worker_website/frontend/Dockerfile
          push: false
          tags: worker-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Check Python formatting with black
        run: |
          pip install black
          black --check worker_website/backend --extend-exclude=venv || true

      - name: Lint with flake8
        run: |
          pip install flake8
          flake8 worker_website/backend --count --select=E9,F63,F7,F82 --show-source --statistics || true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: ./worker_website/frontend/package-lock.json

      - name: Check frontend with ESLint
        working-directory: ./worker_website/frontend
        run: npm install eslint eslint-plugin-react --save-dev 2>/dev/null || npm audit --audit-level=moderate || true

  status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test, lint]
    if: always()

    steps:
      - name: Check CI Status
        run: |
          if [[ "${{ needs.backend-test.result }}" == "failure" || "${{ needs.frontend-test.result }}" == "failure" ]]; then
            echo "❌ CI failed"
            exit 1
          fi
          echo "✅ CI passed"
